server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: bibliometria-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  corpus:
    directory: ${CORPUS_DIRECTORY:abstracts}
  minilm:
    embedding-file: ${MINILM_EMBEDDING_FILE:embeddings/minilm_abstracts.txt}
  glove:
    embedding-file: ${GLOVE_EMBEDDING_FILE:embeddings/glove_corpus.txt}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
