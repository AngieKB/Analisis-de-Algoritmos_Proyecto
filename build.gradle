plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    // Word2Vec – Deeplearning4j NLP y backend nativo para CPU (todas las plataformas)
    implementation 'org.deeplearning4j:deeplearning4j-nlp:1.0.0-M2.1'
    implementation 'org.nd4j:nd4j-native-platform:1.0.0-M2.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true // para ver los println del test
    }
}

application {
    mainClass = 'Main'
}

tasks.register('generarGlove', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.proyecto.bibliometria.r1_similitud.algo_ia.GenerarGloVeCorpus'
}