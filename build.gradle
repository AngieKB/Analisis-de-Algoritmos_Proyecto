plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    // DJL para tokenización Hugging Face e inferencia con ONNX Runtime
    implementation 'ai.djl.huggingface:tokenizers:0.35.1'
    implementation 'ai.djl.onnxruntime:onnxruntime-engine:0.35.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true // para ver los println del test
    }
}

application {
    mainClass = 'Main'
}

tasks.register('generarGlove', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.proyecto.bibliometria.r1_similitud.algo_ia.GenerarGloVeCorpus'
}