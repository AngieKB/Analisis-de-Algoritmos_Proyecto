plugins {
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    // DJL para tokenización Hugging Face e inferencia con ONNX Runtime
    implementation 'ai.djl.huggingface:tokenizers:0.35.1'
    implementation 'ai.djl.onnxruntime:onnxruntime-engine:0.35.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

application {
    mainClass = 'com.proyecto.bibliometria.BibliometriaApplication'
}

tasks.register('generarGlove', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.proyecto.bibliometria.r1_similitud.algo_ia.GenerarGloVeCorpus'
}

tasks.register('generarMiniLM', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.proyecto.bibliometria.r1_similitud.algo_ia.GenerarEmbeddingsMiniLM'
}

tasks.named('processResources') {
    from('abstracts') {
        into 'corpus/abstracts'
    }
    from('embeddings/minilm_abstracts.txt') {
        into 'corpus'
    }
}